<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤰 Obstetric Calculator: EDD & Gestational Age</title>
  <link rel="stylesheet" href="edd.css">
</head>
<body>

  <div class="container">
    <h1>🤰 Obstetric Calculator</h1>
    <p class="subtitle">Estimated Delivery Date & Gestational Age</p>

    <!-- Mode Switcher -->
    <div class="mode-switcher">
      <button class="mode-btn active" onclick="switchMode('lmp')">From LMP</button>
      <button class="mode-btn" onclick="switchMode('scan')">From Scan <span class="beta-tag">BETA</span></button>
    </div>

    <!-- From LMP Mode -->
    <div id="lmpMode" class="mode-content">
      <div class="input-group">
        <input type="text" id="lmp" value="2082-04-17" placeholder=" ">
        <label for="lmp">Enter LMP (YYYY-MM-DD)</label>
      </div>

      <div class="input-group">
        <input type="text" id="today" value="2082-07-" placeholder=" ">
        <label for="today">Enter today's date (YYYY-MM-DD, optional)</label>
      </div>

      <button onclick="calculate()">Calculate</button>
    </div>

    <!-- From Scan Mode -->
    <div id="scanMode" class="mode-content" style="display: none;">
      <div class="input-group">
        <input type="text" id="scanDate" placeholder=" ">
        <label for="scanDate">Scan Date (YYYY-MM-DD)</label>
      </div>

      <p class="input-label">Estimated Gestational Age by Scan:</p>
      <div class="input-row">
        <div class="input-group">
          <input type="number" id="scanWeeks" min="0" max="42" placeholder=" ">
          <label for="scanWeeks">Weeks</label>
        </div>
        <div class="input-group">
          <input type="number" id="scanDays" min="0" max="6" placeholder=" ">
          <label for="scanDays">Days</label>
        </div>
      </div>

      <div class="input-group">
        <input type="text" id="todayScan" placeholder=" ">
        <label for="todayScan">Today's Date (YYYY-MM-DD)</label>
      </div>

      <button onclick="calculateFromScan()">Calculate</button>
    </div>

    <div id="result"></div>
  </div>

    };

    // Initialize firebase app on this page (if not already initialized)
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // Redirect to homepage if user is not signed in
    auth.onAuthStateChanged((user) => {
      if (!user) {
        // Not signed in - go back to main page where login is available
        window.location.href = "../index.html";
      }
    });
  </script>

  <!-- Local calculator logic and small touch helper -->
  <script src="edd.js"></script>
  <script>
    document.querySelectorAll('.edd-card, .ga-card').forEach(card => {
      card.addEventListener('touchstart', () => card.classList.add('touch-active'));
      card.addEventListener('touchend', () => card.classList.remove('touch-active'));
      card.addEventListener('touchcancel', () => card.classList.remove('touch-active'));
    });
  </script>
